name: eval
on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python assignments/capstone/eval_gate.py assignments/capstone/reports/eval_after.json --min faithfulness=0.7 --min context_recall=0.8 --max latency_p95_ms=500 --max sim_cost_usd=0.05
